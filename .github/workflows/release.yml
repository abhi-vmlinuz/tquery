name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Linux
          - goos: linux
            goarch: amd64
            archive: tar.gz
          - goos: linux
            goarch: arm64
            archive: tar.gz
          - goos: linux
            goarch: arm
            goarm: 7
            archive: tar.gz
          - goos: linux
            goarch: riscv64
            archive: tar.gz
          # Darwin (macOS)
          - goos: darwin
            goarch: amd64
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            archive: tar.gz
          # Windows
          - goos: windows
            goarch: amd64
            archive: zip
          - goos: windows
            goarch: arm64
            archive: zip
          # FreeBSD
          - goos: freebsd
            goarch: amd64
            archive: tar.gz

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            EXT=".exe"
          fi
          
          mkdir -p dist
          BIN_NAME="tq${EXT}"
          go build -ldflags="-s -w -X 'github.com/tquery/tquery/cmd.Version=${TAG_NAME#v}'" -o "dist/${BIN_NAME}" main.go
          
          ARCH_SUFFIX="${{ matrix.goos }}_${{ matrix.goarch }}"
          if [ -n "${{ matrix.goarm }}" ]; then
            ARCH_SUFFIX="${{ matrix.goos }}_${{ matrix.goarch }}v${{ matrix.goarm }}"
          fi
          
          PACKAGE_NAME="tq-${TAG_NAME}-${ARCH_SUFFIX}"
          mkdir -p "dist/${PACKAGE_NAME}"
          cp "dist/${BIN_NAME}" "dist/${PACKAGE_NAME}/"
          cp README.md LICENSE "dist/${PACKAGE_NAME}/" 2>/dev/null || true
          
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            zip -r "${PACKAGE_NAME}.zip" "${PACKAGE_NAME}"
          else
            tar -czvf "${PACKAGE_NAME}.tar.gz" "${PACKAGE_NAME}"
          fi
          cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.${{ matrix.archive }}

  publish-release:
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download all built assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
